name: Auto update build plan

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    # Every friday at 4 PM
    - cron: "0 16 * * 5"
  push:
    paths:
      - coordinator/**
jobs:
  build-plan:
    runs-on: ubuntu-22.04
    # Stay under the hosted-runner ceiling so a slow plan fails the step instead of cancelling the job.
    # Cancellation skips every later step, including cache save, so the next week starts cold.
    timeout-minutes: 360
    if: github.repository == 'VirtusLab/community-build3' && contains(github.ref, 'master')
    steps:
      - uses: actions/checkout@v6
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          apps: scala-cli:1.12.5

      - name: Restore coordinator data
        uses: actions/cache/restore@v4
        with:
          # coordinator stores cache in the working directory (Scaladex modules, Maven targets, build defs)
          path: |
            data/
            coordinator/data/
          # A new key every run. actions/cache will not overwrite an existing key, and the old
          # fixed key was never saved: the 6h job cancellation skipped the post-cache step.
          key: coordinator-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            coordinator-data-

      - name: Build plan
        # Leave time for the cache save below. GitHub kills the whole job at 6h and then saves nothing.
        timeout-minutes: 330
        # Limit each build plan to at most 1000 most project.
        # GitHub actions has problems when rendering workflow of more then 1k jobs
        # Projects are grouped based on GitHub stars
        run: scala-cli run coordinator/ -- 3 -1 -1 1000 "" coordinator/configs

      - name: Save coordinator data
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/
            coordinator/data/
          key: coordinator-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "buildConfig"
          path: |
            .github/workflows/buildPlan*.yaml
            .github/workflows/buildConfig.json

      - uses: tibdex/github-app-token@v1
        id: generate-token
        with:
          app_id: 303718
          private_key: ${{ secrets.OPENCB_CONFIG_UPDATE_TOKEN }}

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: Update build config
          assignees: WojciechMazur
          branch: build/scheduled-update
          branch-suffix: timestamp
          delete-branch: true
          title: "[Bot] Update build config"
          draft: false
          add-paths: |
            .github/workflows/buildPlan*.yaml
            .github/workflows/buildConfig.json
